<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with CV</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }
        .box {
            max-width: 600px;
            background: white;
            padding: 20px;
            margin: auto;
            border-radius: 8px;
        }
        h2 { text-align: center; }
        input, textarea, button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .answer {
            margin-top: 15px;
            padding: 10px;
            background: #eef;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>📄 Chat with CV</h2>

    <input type="text" id="apiKey" placeholder="Enter Gemini API Key">
    <button onclick="setApiKey()">Set API Key</button>

    <hr>

    <input type="file" id="cvFile">
    <button onclick="uploadCV()">Upload CV</button>

    <hr>

    <textarea id="question" placeholder="Ask a question from CV"></textarea>
    <button onclick="askQuestion()">Ask</button>

    <div class="answer" id="answer"></div>
</div>

<script>
const BASE_URL = "http://localhost:8000";

async function setApiKey() {
    const key = document.getElementById("apiKey").value;
    const res = await fetch(`${BASE_URL}/set-api-key`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ api_key: key })
    });
    alert("API Key Set");
}

async function uploadCV() {
    const fileInput = document.getElementById("cvFile");
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    const res = await fetch(`${BASE_URL}/upload-cv`, {
        method: "POST",
        body: formData
    });

    alert("CV Uploaded");
}

async function askQuestion() {
    const q = document.getElementById("question").value;

    const res = await fetch(`${BASE_URL}/ask`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ query: q })
    });

    const data = await res.json();
    document.getElementById("answer").innerText = data.answer;
}
</script>

</body>
</html>
